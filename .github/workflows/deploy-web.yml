# Publishes the web version (PWA) to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions".
# Optional: repository variable CORS_PROXY (Settings → Secrets and variables → Actions → Variables),
# e.g. https://coolread-proxy.name.workers.dev/?url= — needed for catalogs (see web-pwa/README.md).
name: Deploy web version

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
        env:
          VITE_CORS_PROXY: ${{ vars.CORS_PROXY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-web
      - id: deployment
        uses: actions/deploy-pages@v4
